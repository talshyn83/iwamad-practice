<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talshyn | Profile Card</title>

    <!-- Подключаем Tailwind CSS через CDN (как в задании) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="site-header">
        <h1>My Profile</h1>
        <p>Week 2 Practice — Interactive Profile Card</p>
    </header>

    <main class="main-content">
        <section class="profile-card" id="profileCard">
            <div class="profile-top">
                <!-- Добавил Tailwind-классы для аватара -->
                <div class="avatar rounded-full p-4 flex items-center justify-center bg-zinc-900 text-white text-3xl font-bold">
                    T
                </div>

                <div class="profile-info">
                    <h2>Talshyn</h2>
                    <p class="bio">
                        I am an IT Management student interested in technology,
                        web development, and learning new digital skills.
                        I enjoy creating simple and useful projects.
                    </p>
                </div>
            </div>

            <div class="links">
                <a href="mailto:example@email.com">Email</a>
                <a href="https://github.com/" target="_blank">GitHub</a>
            </div>

            <!-- Добавил Tailwind-классы для кнопки -->
            <button
                id="likeButton"
                type="button"
                class="rounded-lg px-4 py-2 mt-6 bg-zinc-900 text-white cursor-pointer hover:opacity-85 transition"
            >
                ♡ Like
            </button>

            <p id="likeMessage" class="like-message mt-3 text-zinc-500">
                You haven't liked this card yet.
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 Talshyn — IWaMAD Week 2</p>
    </footer>

    <!-- Подключаем наш JS -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
