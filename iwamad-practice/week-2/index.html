<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Card - Week 2</title>

    <link rel="stylesheet" href="style.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <header class="site-header">
        <h1>My Profile</h1>
        <p>Week 2 Practice — Interactive Profile Card</p>
    </header>

    <main class="main-content">

        <section class="profile-card" id="profileCard">

            <div class="profile-top">

                <div class="avatar">
                    T
                </div>

                <div class="profile-info">
                    <h2>Talshyn</h2>

                    <p class="bio">
                        I am an IT Management student interested in technology,
                        web development, and learning new digital skills.
                        I enjoy creating simple and useful projects.
                    </p>
                </div>

            </div>

            <div class="links">
                <a href="mailto:example@email.com">
                    Email
                </a>

                <a href="https://github.com/" target="_blank">
                    GitHub
                </a>
            </div>

            <button id="likeButton" type="button">
                ♡ Like
            </button>

            <p id="likeMessage" class="like-message">
                You haven't liked this card yet.
            </p>

        </section>

    </main>

    <footer class="site-footer">
        <p>© 2026 Talshyn — IWaMAD Week 2</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
